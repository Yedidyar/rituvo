packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@clerk/shared": true
  bufferutil: true
  core-js: true
  # cpu-features, protobufjs and ssh2 come in transitively with Testcontainers
  # (dockerode → ssh2). Their native builds only matter for Docker-over-SSH,
  # which we don't use — the local socket path never loads them.
  cpu-features: false
  esbuild: true
  lightningcss: true
  nx: true
  protobufjs: false
  ssh2: false
  unrs-resolver: true
  utf-8-validate: true

autoInstallPeers: true
