name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

env:
  CI: true
  # Allow restoring Nx cache artifacts created on other CI runners.
  NX_REJECT_UNKNOWN_LOCAL_CACHE: 0

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            cache-group: lint
            command: pnpm nx affected -t lint
          - name: Format Check
            cache-group: format
            command: pnpm nx affected -t format:check
          - name: Test
            cache-group: test
            command: pnpm nx affected -t test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Restore Nx cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .nx/cache
            .nx/workspace-data
          key: nx-${{ runner.os }}-${{ matrix.cache-group }}-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ matrix.cache-group }}-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-
            nx-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v5

      - name: Run
        run: ${{ matrix.command }}

      - name: Save Nx cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .nx/cache
            .nx/workspace-data
          key: nx-${{ runner.os }}-${{ matrix.cache-group }}-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-${{ github.sha }}

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Fork PRs cannot read repository secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: rituvo
          POSTGRES_PASSWORD: rituvo
          POSTGRES_DB: rituvo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rituvo -d rituvo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://rituvo:rituvo@localhost:5432/rituvo
      HOST: localhost
      PORT: 3001
      WEB_ORIGIN: http://localhost:3000
      NODE_ENV: development
      CLERK_TELEMETRY_DISABLED: 1
      VITE_CLERK_TELEMETRY_DISABLED: 1
      VITE_API_URL: http://localhost:3001
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require e2e secrets
        run: |
          test -n "$CLERK_PUBLISHABLE_KEY"
          test -n "$CLERK_SECRET_KEY"
          test -n "$E2E_CLERK_USER_EMAIL"

      - name: Install Playwright browsers
        run: pnpm --filter @rituvo/web exec playwright install --with-deps chromium

      - name: Apply database schema
        run: pnpm --filter @rituvo/api db:push

      - name: Build and start API
        run: |
          pnpm nx build api
          pnpm nx serve api > api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3001/health > /dev/null; then
              echo "API is ready"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to start:"
          cat api.log
          exit 1

      - name: Start web
        run: |
          pnpm nx dev web > web.log 2>&1 &
          for i in $(seq 1 150); do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "Web is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Web failed to start:"
          cat web.log
          exit 1

      - name: Run Playwright tests
        run: pnpm nx e2e web

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
